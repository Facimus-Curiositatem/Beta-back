<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esNuevo} ? 'Nuevo rol de proceso - Gestion de Procesos' : 'Editar rol de proceso - Gestion de Procesos'">Rol de proceso</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="tarjeta tarjeta-angosta">
            <h1 th:text="${esNuevo} ? 'Nuevo rol de proceso' : 'Editar rol de proceso'">Rol de proceso</h1>

            <form method="post"
                  th:action="${esNuevo} ? @{/roles} : @{'/roles/' + ${rolId}}"
                  th:object="${rolProcesoForm}">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripcion</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <a th:href="@{/roles}" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
