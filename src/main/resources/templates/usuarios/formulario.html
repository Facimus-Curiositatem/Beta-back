<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esNuevo} ? 'Nuevo usuario - Gestion de Procesos' : 'Editar usuario - Gestion de Procesos'">Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="tarjeta tarjeta-angosta">
            <h1 th:text="${esNuevo} ? 'Nuevo usuario' : 'Editar rol de acceso'">Usuario</h1>

            <form method="post"
                  th:action="${esNuevo} ? @{/usuarios} : @{'/usuarios/' + ${usuarioId}}"
                  th:object="${usuarioForm}">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" th:readonly="${not esNuevo}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" th:field="*{email}" th:readonly="${not esNuevo}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group" th:if="${esNuevo}">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" th:field="*{password}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label for="rolAcceso">Rol de acceso</label>
                    <select id="rolAcceso" th:field="*{rolAcceso}" required>
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="EDITOR">Editor</option>
                        <option value="SOLO_LECTURA">Solo lectura</option>
                    </select>
                    <div class="campo-error" th:if="${#fields.hasErrors('rolAcceso')}" th:errors="*{rolAcceso}"></div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <a th:href="@{/usuarios}" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
