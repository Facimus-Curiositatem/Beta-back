<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Gestion de Procesos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="barra-acciones">
            <h1>Usuarios de la empresa</h1>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primario">Nuevo usuario</a>
        </div>

        <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>

        <table th:if="${not #lists.isEmpty(usuarios)}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol de acceso</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nombre}">Nombre</td>
                    <td th:text="${usuario.email}">correo@empresa.com</td>
                    <td th:text="${usuario.rolAcceso}">ADMINISTRADOR</td>
                    <td class="acciones-tabla">
                        <a th:href="@{'/usuarios/' + ${usuario.id} + '/editar'}" class="btn btn-secundario btn-pequeno">Editar rol</a>
                        <form method="post" th:action="@{'/usuarios/' + ${usuario.id} + '/desactivar'}"
                              onsubmit="return confirm('¿Desactivar este usuario?');">
                            <button type="submit" class="btn btn-peligro btn-pequeno">Desactivar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="vacio" th:if="${#lists.isEmpty(usuarios)}">
            Aun no hay usuarios registrados.
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
