<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesos - Gestion de Procesos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="barra-acciones">
            <h1>Procesos</h1>
            <a th:if="${puedeEditarSesion}" th:href="@{/procesos/nuevo}" class="btn btn-primario">Nuevo proceso</a>
        </div>

        <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>

        <form method="get" th:action="@{/procesos}" class="barra-filtros">
            <div class="form-group">
                <label for="nombre">Buscar por nombre</label>
                <input type="text" id="nombre" name="nombre" th:value="${nombre}">
            </div>
            <div class="form-group">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Todos</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                            th:selected="${e == estado}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria" th:value="${categoria}">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-secundario">Filtrar</button>
            </div>
        </form>

        <table th:if="${procesos.totalElements > 0}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoria</th>
                    <th>Estado</th>
                    <th>Ultima modificacion</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="proceso : ${procesos.content}">
                    <td th:text="${proceso.nombre}">Nombre</td>
                    <td th:text="${proceso.categoria}">Categoria</td>
                    <td>
                        <span class="etiqueta"
                              th:classappend="${proceso.estado.name() == 'PUBLICADO'} ? 'etiqueta-publicado' : 'etiqueta-borrador'"
                              th:text="${proceso.estado}">BORRADOR</span>
                    </td>
                    <td th:text="${#temporals.format(proceso.fechaModificacion, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td><a th:href="@{'/procesos/' + ${proceso.id}}" class="btn btn-secundario btn-pequeno">Ver</a></td>
                </tr>
            </tbody>
        </table>

        <div class="vacio" th:if="${procesos.totalElements == 0}">
            No se encontraron procesos con los filtros seleccionados.
        </div>

        <div class="paginacion" th:if="${procesos.totalPages > 1}">
            <span th:each="i : ${#numbers.sequence(0, procesos.totalPages - 1)}">
                <span th:if="${i == procesos.number}" class="activa" th:text="${i + 1}">1</span>
                <a th:unless="${i == procesos.number}"
                   th:href="@{/procesos(pagina=${i}, nombre=${nombre}, estado=${estado}, categoria=${categoria})}"
                   th:text="${i + 1}">2</a>
            </span>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
