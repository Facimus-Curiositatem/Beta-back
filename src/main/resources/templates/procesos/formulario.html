<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esNuevo} ? 'Nuevo proceso - Gestion de Procesos' : 'Editar proceso - Gestion de Procesos'">Proceso</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="tarjeta tarjeta-angosta">
            <h1 th:text="${esNuevo} ? 'Nuevo proceso' : 'Editar proceso'">Proceso</h1>

            <form method="post"
                  th:action="${esNuevo} ? @{/procesos} : @{'/procesos/' + ${procesoId}}"
                  th:object="${procesoForm}">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripcion</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="4" required></textarea>
                    <div class="campo-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>

                <div class="form-fila">
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" th:field="*{categoria}" required>
                        <div class="campo-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    </div>

                    <div class="form-group" th:unless="${esNuevo}">
                        <label for="estado">Estado</label>
                        <select id="estado" th:field="*{estado}">
                            <option value="BORRADOR">Borrador</option>
                            <option value="PUBLICADO">Publicado</option>
                        </select>
                    </div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <a th:href="@{/procesos}" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
