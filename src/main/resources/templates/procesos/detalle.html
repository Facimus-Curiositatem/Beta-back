<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${proceso.nombre} + ' - Gestion de Procesos'">Proceso</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>

        <div class="barra-acciones">
            <div>
                <h1 th:text="${proceso.nombre}">Nombre del proceso</h1>
                <span class="etiqueta"
                      th:classappend="${proceso.estado.name() == 'PUBLICADO'} ? 'etiqueta-publicado' : 'etiqueta-borrador'"
                      th:text="${proceso.estado}">BORRADOR</span>
            </div>
            <div class="acciones-tabla" th:if="${puedeEditarSesion}">
                <a th:href="@{'/procesos/' + ${proceso.id} + '/editar'}" class="btn btn-secundario">Editar</a>
                <form method="post" th:if="${proceso.estado.name() == 'BORRADOR'}"
                      th:action="@{'/procesos/' + ${proceso.id} + '/publicar'}">
                    <button type="submit" class="btn btn-primario">Publicar</button>
                </form>
                <form method="post" th:if="${esAdministradorSesion}"
                      th:action="@{'/procesos/' + ${proceso.id} + '/eliminar'}"
                      onsubmit="return confirm('¿Eliminar este proceso? Podras seguir consultandolo como inactivo.');">
                    <button type="submit" class="btn btn-peligro">Eliminar</button>
                </form>
            </div>
        </div>

        <div class="tarjeta">
            <p><strong>Categoria:</strong> <span th:text="${proceso.categoria}">Categoria</span></p>
            <p><strong>Descripcion:</strong> <span th:text="${proceso.descripcion}">Descripcion</span></p>
            <p class="texto-suave">
                Creado el <span th:text="${#temporals.format(proceso.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                · Ultima modificacion <span th:text="${#temporals.format(proceso.fechaModificacion, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </p>
        </div>

        <div class="tarjeta">
            <h2>Historial de cambios</h2>
            <ul class="historial-lista" th:if="${not #lists.isEmpty(historial)}">
                <li th:each="item : ${historial}">
                    <strong th:text="${#temporals.format(item.fechaCambio, 'dd/MM/yyyy HH:mm')}">01/01/2026</strong>
                    — <span th:text="${item.descripcionCambio}">Cambio</span>
                    (<span th:text="${item.autor.nombre}">Autor</span>)
                </li>
            </ul>
            <p class="texto-suave" th:if="${#lists.isEmpty(historial)}">Aun no hay cambios registrados.</p>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
