<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar empresa - Gestion de Procesos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="tarjeta tarjeta-angosta">
            <h1>Registrar empresa</h1>
            <p class="texto-suave">Crea el espacio independiente de tu organizacion y su administrador inicial.</p>

            <form method="post" th:action="@{/empresas/registro}" th:object="${registroEmpresaForm}">

                <div class="form-group">
                    <label for="nombreEmpresa">Nombre de la empresa</label>
                    <input type="text" id="nombreEmpresa" th:field="*{nombreEmpresa}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nombreEmpresa')}" th:errors="*{nombreEmpresa}"></div>
                </div>

                <div class="form-group">
                    <label for="nit">NIT</label>
                    <input type="text" id="nit" th:field="*{nit}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nit')}" th:errors="*{nit}"></div>
                </div>

                <div class="form-group">
                    <label for="correoContacto">Correo de contacto</label>
                    <input type="email" id="correoContacto" th:field="*{correoContacto}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('correoContacto')}" th:errors="*{correoContacto}"></div>
                </div>

                <hr>
                <p class="texto-suave">Datos del administrador inicial</p>

                <div class="form-group">
                    <label for="nombreAdmin">Nombre completo</label>
                    <input type="text" id="nombreAdmin" th:field="*{nombreAdmin}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('nombreAdmin')}" th:errors="*{nombreAdmin}"></div>
                </div>

                <div class="form-group">
                    <label for="emailAdmin">Correo</label>
                    <input type="email" id="emailAdmin" th:field="*{emailAdmin}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('emailAdmin')}" th:errors="*{emailAdmin}"></div>
                </div>

                <div class="form-group">
                    <label for="passwordAdmin">Contrasena</label>
                    <input type="password" id="passwordAdmin" th:field="*{passwordAdmin}" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('passwordAdmin')}" th:errors="*{passwordAdmin}"></div>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primario">Registrar empresa</button>
                    <a th:href="@{/login}" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
