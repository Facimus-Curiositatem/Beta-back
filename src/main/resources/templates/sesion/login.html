<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Gestion de Procesos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <div class="tarjeta tarjeta-angosta">
            <h1>Iniciar sesion</h1>
            <p class="texto-suave">Accede a los procesos de tu empresa.</p>

            <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
            <div class="alerta alerta-exito" th:if="${mensaje}" th:text="${mensaje}"></div>

            <form method="post" th:action="@{/login}" th:object="${loginForm}">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" th:field="*{email}" autocomplete="email" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="current-password" required>
                    <div class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="acciones-formulario">
                    <button type="submit" class="btn btn-primario">Ingresar</button>
                </div>
            </form>

            <p class="texto-suave">
                &iquest;Tu empresa aun no esta registrada?
                <a th:href="@{/empresas/registro}">Registrala aqui</a>.
            </p>
            <p class="texto-suave">
                Demo: <code>admin@demo.com</code> / <code>admin123</code>
            </p>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
